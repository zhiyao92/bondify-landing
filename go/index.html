<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Opening the App Store…</title>
<meta name="robots" content="noindex">

<!--
  Click-counting interstitial. Same approach as lds-quotes-landing/go/.

  Every "Download on the App Store" button on the landing page points here, so a
  pageview of /go IS an App Store button click. Then we bounce the visitor on to Apple.

  The journey is usually Instagram in-app browser → here, and in-app browsers suppress
  JS-initiated navigation, so the auto-redirect quietly fails there. This page is built
  for that:
  - the auto hop still fires (works in real browsers; Safari hands apps.apple.com
    straight to the App Store app)
  - a big manual button is the real path in-app: a user tap on an apps.apple.com
    link is the one navigation in-app browsers always honour
  - below it, instructions for the stubborn case: ··· menu → open in external browser
  - a plain meta refresh covers the no-JS case

  ?src= says which button was clicked (nav / hero / final / footer).
-->

<!-- JS-less fallback: give any analytics beacon a moment, then go -->
<meta http-equiv="refresh" content="2;url=https://apps.apple.com/app/apple-store/id6761910667?pt=118418326&amp;ct=Instagram&amp;mt=8">

<link rel="icon" href="../app-icon.png">
<style>
  body{
    margin:0; min-height:100vh; display:grid; place-items:center;
    background:#FBFAFF; color:#171235;
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
    text-align:center; padding:24px;
  }
  .box{max-width:340px}
  .icon{width:76px; height:76px; border-radius:18px; box-shadow:0 12px 30px rgba(59,42,140,.28)}
  p{color:#6B6588; font-size:15px; margin:18px 0 0}
  .spin{
    margin:20px auto 0; width:22px; height:22px; border-radius:50%;
    border:2.5px solid rgba(23,18,53,.12); border-top-color:#5B3FD8;
    animation:spin .7s linear infinite;
  }
  @keyframes spin{to{transform:rotate(360deg)}}
  @media (prefers-reduced-motion:reduce){ .spin{animation:none} }
  .store-btn{
    display:inline-flex; align-items:center; gap:10px; margin-top:22px;
    background:linear-gradient(120deg,#5B3FD8,#7A5BF0); color:#fff; text-decoration:none;
    font-weight:700; font-size:16px; padding:14px 26px; border-radius:999px;
    box-shadow:0 10px 28px rgba(91,63,216,.32);
  }
  .store-btn svg{width:20px; height:20px; flex:none; fill:currentColor}
  .hint{
    margin-top:26px; padding:14px 16px; border-radius:14px; text-align:left;
    background:#FFF1ED; border:1px solid #FFD9CD;
    font-size:13.5px; color:#8A4632; line-height:1.55;
  }
  .hint b{color:#171235}
</style>
</head>
<body>
  <div class="box">
    <img class="icon" src="../app-icon.png" alt="Bondify">
    <div class="spin" aria-hidden="true"></div>
    <p>Taking you to the App&nbsp;Store…</p>

    <a class="store-btn" href="https://apps.apple.com/app/apple-store/id6761910667?pt=118418326&amp;ct=Instagram&amp;mt=8">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M16.36 12.72c-.02-2.3 1.88-3.4 1.96-3.46-1.07-1.56-2.73-1.78-3.32-1.8-1.41-.14-2.76.83-3.48.83-.72 0-1.83-.81-3-.79-1.55.02-2.98.9-3.77 2.29-1.61 2.79-.41 6.92 1.15 9.18.76 1.11 1.67 2.35 2.86 2.31 1.15-.05 1.58-.74 2.97-.74 1.38 0 1.78.74 2.99.72 1.23-.02 2.02-1.13 2.78-2.24.88-1.29 1.24-2.54 1.26-2.6-.03-.01-2.41-.93-2.4-3.7ZM14.1 5.9c.63-.77 1.06-1.83.94-2.9-.91.04-2.02.61-2.67 1.37-.58.68-1.09 1.77-.95 2.81 1.02.08 2.05-.52 2.68-1.28Z"/></svg>
      Open the App&nbsp;Store
    </a>

    <div class="hint">
      <b>Still not redirecting?</b> You&rsquo;re probably in Instagram&rsquo;s built-in browser.
      Tap the <b>&middot;&middot;&middot;</b> menu in the top-right corner and choose
      <b>&ldquo;Open in external browser&rdquo;</b> &mdash; the App&nbsp;Store will open from there.
    </div>
  </div>

<script>
(function () {
  var STORE = 'https://apps.apple.com/app/apple-store/id6761910667?pt=118418326&ct=Instagram&mt=8';

  function goTo(url) {
    // a shortener may serve us inside a frame — aim for the top window,
    // fall back to our own if cross-origin rules say no
    try { window.top.location.href = url; }
    catch (e) { window.location.href = url; }
  }

  // Short pause so any analytics beacon fires before we navigate away.
  // In-app browsers may ignore this JS hop entirely — that's what the button is for.
  setTimeout(function () { goTo(STORE); }, 300);
})();
</script>
</body>
</html>
